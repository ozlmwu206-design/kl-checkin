<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打卡</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Noto Sans Thai", "PingFang TC", sans-serif;
    text-align: center;
    padding: 24px 16px;
    background: #f5f6f7;
    color: #222;
    margin: 0;
  }
  #langBar { margin-bottom: 16px; }
  select { padding: 8px 12px; font-size: 14px; border-radius: 8px; border: 1px solid #ccc; }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  #userInfo { color: #555; margin-bottom: 16px; min-height: 20px; }

  .choice-section { max-width: 320px; margin: 0 auto 20px; }
  .choice-label { font-size: 14px; color: #555; margin-bottom: 10px; }
  .choice-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .choice-btn {
    padding: 14px 6px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 10px;
    border: 2px solid #ccc;
    background: #fff;
    color: #444;
    cursor: pointer;
  }
  .choice-btn.active-worktype {
    border-color: #06C755;
    background: #e6f9ee;
    color: #06773b;
  }
  .choice-btn.active-site {
    border-color: #2f80ed;
    background: #e8f0fe;
    color: #1a56b0;
  }

  .btn {
    display: block;
    width: 100%;
    max-width: 320px;
    margin: 12px auto;
    padding: 18px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    color: #fff;
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.5; }
  .btn-in { background: #06C755; }
  .btn-out { background: #e05252; }
  #status {
    margin-top: 20px;
    font-size: 15px;
    color: #333;
    white-space: pre-wrap;
    max-width: 340px;
    margin-left: auto;
    margin-right: auto;
  }
  #uidBox {
    margin-top: 24px;
    font-size: 12px;
    color: #888;
    word-break: break-all;
    max-width: 340px;
    margin-left: auto;
    margin-right: auto;
  }

  /* 打卡結果彈窗：畫面正中央彈出，不管手機解析度多少、頁面捲到哪裡都看得到 */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: #fff;
    border-radius: 18px;
    padding: 30px 22px 22px;
    max-width: 320px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    animation: modalPop 0.18s ease-out;
  }
  @keyframes modalPop {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal-icon { font-size: 50px; margin-bottom: 6px; line-height: 1; }
  .modal-title-zh { font-size: 21px; font-weight: bold; color: #222; }
  .modal-title-th { font-size: 16px; font-weight: bold; color: #777; margin-top: 3px; margin-bottom: 14px; }
  .modal-divider { border-top: 1px solid #eee; margin: 2px 0 14px; }
  .modal-body-zh { font-size: 17px; color: #333; line-height: 1.5; }
  .modal-body-th { font-size: 15px; color: #1a6fb0; line-height: 1.5; margin-top: 6px; }
  .modal-close-btn {
    margin-top: 22px;
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    background: #06C755;
    color: #fff;
    cursor: pointer;
  }
  .modal-box.warning .modal-close-btn { background: #e8a33d; }
</style>
</head>
<body>

<div id="langBar">
  <select id="langSelect" onchange="setLang(this.value)">
    <option value="zh">繁體中文</option>
    <option value="th">ภาษาไทย</option>
  </select>
</div>

<h1 id="title">員工打卡</h1>
<div id="userInfo">載入中...</div>

<div class="choice-section">
  <div class="choice-label" id="workTypeLabel">請先選擇今天的工種</div>
  <div class="choice-grid" id="workTypeGrid"></div>
</div>

<div class="choice-section">
  <div class="choice-label" id="siteLabel">請先選擇今天的工地</div>
  <div class="choice-grid" id="siteGrid"></div>
</div>

<button class="btn btn-in" id="btnIn" onclick="checkin('上班')" disabled>上班打卡</button>
<button class="btn btn-out" id="btnOut" onclick="checkin('下班')" disabled>下班打卡</button>

<div id="status"></div>
<div id="uidBox"></div>

<!-- 打卡結果彈窗：中泰文同時顯示，不受目前選擇的介面語言影響，確保移工一定看得懂 -->
<div id="modalOverlay" class="modal-overlay" onclick="if (event.target === this) closeModal();">
  <div class="modal-box" id="modalBox">
    <div class="modal-icon" id="modalIcon">✅</div>
    <div class="modal-title-zh" id="modalTitleZh"></div>
    <div class="modal-title-th" id="modalTitleTh"></div>
    <div class="modal-divider"></div>
    <div class="modal-body-zh" id="modalBodyZh"></div>
    <div class="modal-body-th" id="modalBodyTh"></div>
    <button class="modal-close-btn" onclick="closeModal()">確定 / ตกลง</button>
  </div>
</div>

<script>
// =====================================================================
// 部署後請把下面兩個值換成你自己的：
//   1) LIFF_ID    -> 在 LINE Developers 建立 LIFF 後拿到的 ID
//   2) SCRIPT_URL -> Apps Script 部署成「網頁應用程式」後拿到的網址（結尾 /exec）
// =====================================================================
const LIFF_ID = 'YOUR_LIFF_ID';
const SCRIPT_URL = 'YOUR_SCRIPT_URL';

// 工種固定四選一，跟後端 Code.gs 的 WORK_TYPES 要一致
const WORK_TYPES = [
  { value: '公司', zh: '公司', th: 'บริษัท' },
  { value: '鋼筋', zh: '鋼筋', th: 'งานเหล็กเสริม' },
  { value: '模板', zh: '模板', th: 'งานแบบหล่อ' },
  { value: '水電', zh: '水電', th: 'งานประปาไฟฟ้า' },
];

// 工地固定三選一，跟後端 Code.gs 的 SITE_OPTIONS 要一致
// （打卡頁上顯示的是簡稱，月報表會自動換成正式地點名稱：學校→東海國中、警察局→豐里派出所、太麻里→太麻里）
const SITES = [
  { value: '學校', zh: '學校', th: 'โรงเรียน' },
  { value: '警察局', zh: '警察局', th: 'สถานีตำรวจ' },
  { value: '太麻里', zh: '太麻里', th: 'ไทมาลี่' },
];

const I18N = {
  zh: {
    title: '員工打卡',
    in: '上班打卡',
    out: '下班打卡',
    loading: '載入中...',
    hello: '哈囉，',
    chooseWorkType: '請先選擇今天的工種',
    chooseSite: '請先選擇今天的工地',
    selectionRequired: '請先選擇工種跟工地，再打卡',
    sending: '送出中...',
    success: '✅ 打卡成功',
    notFound: '找不到您的帳號，請把下面這串 LINE ID 提供給管理者，將您加入使用者名單後再試一次。',
    disabled: '您的帳號目前為停用狀態，請聯絡管理者。',
    error: '發生錯誤，請重試或聯絡管理者。',
    yourId: '您的 LINE ID（設定用）：',
  },
  th: {
    title: 'ลงเวลาทำงาน',
    in: 'เข้างาน',
    out: 'เลิกงาน',
    loading: 'กำลังโหลด...',
    hello: 'สวัสดี, ',
    chooseWorkType: 'กรุณาเลือกประเภทงานวันนี้ก่อน',
    chooseSite: 'กรุณาเลือกไซต์งานวันนี้ก่อน',
    selectionRequired: 'กรุณาเลือกประเภทงานและไซต์งานก่อนลงเวลา',
    sending: 'กำลังส่งข้อมูล...',
    success: '✅ บันทึกเวลาสำเร็จ',
    notFound: 'ไม่พบบัญชีของคุณ กรุณาส่ง LINE ID ด้านล่างนี้ให้ผู้ดูแลระบบเพื่อเพิ่มชื่อคุณก่อน แล้วลองใหม่อีกครั้ง',
    disabled: 'บัญชีของคุณถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ',
    error: 'เกิดข้อผิดพลาด กรุณาลองใหม่หรือติดต่อผู้ดูแลระบบ',
    yourId: 'LINE ID ของคุณ (สำหรับตั้งค่า): ',
  },
};

// 上午/下午 + 上班/下班 四種組合的中/泰文顯示文字，打卡成功或重複打卡提示都會用到
const SEGMENT_TYPE_LABELS = {
  zh: {
    '上午上班': '上午上班',
    '上午下班': '上午下班',
    '下午上班': '下午上班',
    '下午下班': '下午下班',
  },
  th: {
    '上午上班': 'เข้างานช่วงเช้า',
    '上午下班': 'เลิกงานช่วงเช้า',
    '下午上班': 'เข้างานช่วงบ่าย',
    '下午下班': 'เลิกงานช่วงบ่าย',
  },
};

function segmentTypeLabel(segment, type) {
  const map = SEGMENT_TYPE_LABELS[lang] || SEGMENT_TYPE_LABELS.zh;
  return map[segment + type] || segment + type;
}

// 打卡成功／重複打卡的訊息都需要帶入時間與時段類型，用函式產生比較方便維護
function buildSuccessMessage(json) {
  const label = segmentTypeLabel(json.segment, json.type);
  return lang === 'zh'
    ? `✅ 打卡成功（${label} ${json.time}）`
    : `✅ บันทึกเวลาสำเร็จ (${label} ${json.time} น.)`;
}

function buildDuplicateMessage(json) {
  const label = segmentTypeLabel(json.segment, json.type);
  return lang === 'zh'
    ? `您已於 ${json.time} 打過「${label}」卡，請勿重複打卡，可以放心離開頁面。`
    : `คุณลงเวลา "${label}" ไปแล้วเมื่อเวลา ${json.time} น. กรุณาอย่าลงเวลาซ้ำ ออกจากหน้านี้ได้เลย`;
}

// 彈窗一律中泰文同時顯示（不看目前選的介面語言），確保移工不管有沒有切換語言都看得懂
function buildModalContent(json) {
  const zhLabel = SEGMENT_TYPE_LABELS.zh[json.segment + json.type] || json.segment + json.type;
  const thLabel = SEGMENT_TYPE_LABELS.th[json.segment + json.type] || json.segment + json.type;
  if (json.duplicate) {
    return {
      icon: '⚠️',
      variant: 'warning',
      zhTitle: '請勿重複打卡',
      thTitle: 'กรุณาอย่าลงเวลาซ้ำ',
      zhBody: `您已於 ${json.time} 打過「${zhLabel}」卡\n不用再按囉，可以放心離開頁面`,
      thBody: `คุณลงเวลา "${thLabel}" ไปแล้วเมื่อเวลา ${json.time} น.\nไม่ต้องกดซ้ำนะ ออกจากหน้านี้ได้เลย`,
    };
  }
  return {
    icon: '✅',
    variant: 'success',
    zhTitle: '打卡成功',
    thTitle: 'บันทึกเวลาสำเร็จ',
    zhBody: `${zhLabel}　${json.time}`,
    thBody: `${thLabel}　เวลา ${json.time} น.`,
  };
}

function openModal(content) {
  document.getElementById('modalIcon').innerText = content.icon;
  document.getElementById('modalTitleZh').innerText = content.zhTitle;
  document.getElementById('modalTitleTh').innerText = content.thTitle;
  document.getElementById('modalBodyZh').innerText = content.zhBody;
  document.getElementById('modalBodyTh').innerText = content.thBody;
  const box = document.getElementById('modalBox');
  box.classList.remove('success', 'warning');
  box.classList.add(content.variant);
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

let lang = 'zh';
let profile = null;
let userOk = false;        // whoami 驗證是否通過
let selectedWorkType = ''; // 目前選擇的工種
let selectedSite = '';     // 目前選擇的工地

function t(key) {
  return I18N[lang][key];
}

function renderWorkTypeButtons() {
  const grid = document.getElementById('workTypeGrid');
  grid.innerHTML = '';
  WORK_TYPES.forEach((wt) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'choice-btn' + (selectedWorkType === wt.value ? ' active-worktype' : '');
    btn.innerText = wt[lang];
    btn.onclick = () => selectWorkType(wt.value);
    grid.appendChild(btn);
  });
}

function renderSiteButtons() {
  const grid = document.getElementById('siteGrid');
  grid.innerHTML = '';
  SITES.forEach((s) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'choice-btn' + (selectedSite === s.value ? ' active-site' : '');
    btn.innerText = s[lang];
    btn.onclick = () => selectSite(s.value);
    grid.appendChild(btn);
  });
}

function selectWorkType(value) {
  selectedWorkType = value;
  renderWorkTypeButtons();
  updateActionButtons();
}

function selectSite(value) {
  selectedSite = value;
  renderSiteButtons();
  updateActionButtons();
}

function updateActionButtons() {
  const enable = userOk && !!selectedWorkType && !!selectedSite;
  document.getElementById('btnIn').disabled = !enable;
  document.getElementById('btnOut').disabled = !enable;
}

function setLang(l) {
  lang = l;
  document.getElementById('title').innerText = t('title');
  document.getElementById('btnIn').innerText = t('in');
  document.getElementById('btnOut').innerText = t('out');
  document.getElementById('workTypeLabel').innerText = t('chooseWorkType');
  document.getElementById('siteLabel').innerText = t('chooseSite');
  renderWorkTypeButtons();
  renderSiteButtons();
  if (profile) {
    document.getElementById('userInfo').innerText = t('hello') + profile.displayName;
  }
}

async function callApi(payload) {
  const res = await fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify(payload),
  });
  return res.json();
}

async function init() {
  renderWorkTypeButtons();
  renderSiteButtons();
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    profile = await liff.getProfile();
    document.getElementById('userInfo').innerText = t('hello') + profile.displayName;
    document.getElementById('uidBox').innerText = t('yourId') + profile.userId;

    const who = await callApi({ action: 'whoami', lineUserId: profile.userId });
    if (!who.ok) {
      userOk = false;
      updateActionButtons();
      document.getElementById('status').innerText =
        who.error === 'user_disabled' ? t('disabled') : t('notFound');
    } else {
      userOk = true;
      updateActionButtons();
    }
  } catch (err) {
    document.getElementById('userInfo').innerText = t('error');
    document.getElementById('status').innerText = String(err);
  }
}

// 不做 GPS 定位，打卡只是為了方便統計出工數，直接送出工種／工地／上下班類型即可
function checkin(type) {
  if (!profile || !userOk) return;
  if (!selectedWorkType || !selectedSite) {
    document.getElementById('status').innerText = t('selectionRequired');
    return;
  }
  document.getElementById('status').innerText = t('sending');
  callApi({
    action: 'checkin',
    lineUserId: profile.userId,
    type: type,
    workType: selectedWorkType,
    site: selectedSite,
  })
    .then((json) => {
      if (!json.ok) {
        document.getElementById('status').innerText =
          json.error === 'user_disabled' ? t('disabled') : t('notFound');
        return;
      }
      document.getElementById('status').innerText = json.duplicate
        ? buildDuplicateMessage(json)
        : buildSuccessMessage(json);
      openModal(buildModalContent(json));
    })
    .catch(() => {
      document.getElementById('status').innerText = t('error');
    });
}

init();
</script>
</body>
</html>
