<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打卡</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Noto Sans Thai", "PingFang TC", sans-serif;
    text-align: center;
    padding: 24px 16px;
    background: #f5f6f7;
    color: #222;
    margin: 0;
  }
  #langBar { margin-bottom: 16px; }
  select { padding: 8px 12px; font-size: 14px; border-radius: 8px; border: 1px solid #ccc; }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  #userInfo { color: #555; margin-bottom: 16px; min-height: 20px; }

  .choice-section { max-width: 320px; margin: 0 auto 20px; }
  .choice-label { font-size: 14px; color: #555; margin-bottom: 10px; }
  .choice-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .choice-btn {
    padding: 14px 6px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 10px;
    border: 2px solid #ccc;
    background: #fff;
    color: #444;
    cursor: pointer;
  }
  .choice-btn.active-worktype {
    border-color: #06C755;
    background: #e6f9ee;
    color: #06773b;
  }
  .choice-btn.active-site {
    border-color: #2f80ed;
    background: #e8f0fe;
    color: #1a56b0;
  }

  .btn {
    display: block;
    width: 100%;
    max-width: 320px;
    margin: 12px auto;
    padding: 18px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    color: #fff;
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.5; }
  .btn-in { background: #06C755; }
  .btn-out { background: #e05252; }
  #status {
    margin-top: 20px;
    font-size: 15px;
    color: #333;
    white-space: pre-wrap;
    max-width: 340px;
    margin-left: auto;
    margin-right: auto;
  }
  #uidBox {
    margin-top: 24px;
    font-size: 12px;
    color: #888;
    word-break: break-all;
    max-width: 340px;
    margin-left: auto;
    margin-right: auto;
  }
</style>
</head>
<body>

<div id="langBar">
  <select id="langSelect" onchange="setLang(this.value)">
    <option value="zh">繁體中文</option>
    <option value="th">ภาษาไทย</option>
  </select>
</div>

<h1 id="title">員工打卡</h1>
<div id="userInfo">載入中...</div>

<div class="choice-section">
  <div class="choice-label" id="workTypeLabel">請先選擇今天的工種</div>
  <div class="choice-grid" id="workTypeGrid"></div>
</div>

<div class="choice-section">
  <div class="choice-label" id="siteLabel">請先選擇今天的工地</div>
  <div class="choice-grid" id="siteGrid"></div>
</div>

<button class="btn btn-in" id="btnIn" onclick="checkin('上班')" disabled>上班打卡</button>
<button class="btn btn-out" id="btnOut" onclick="checkin('下班')" disabled>下班打卡</button>

<div id="status"></div>
<div id="uidBox"></div>

<script>
// =====================================================================
// 部署後請把下面兩個值換成你自己的：
//   1) LIFF_ID    -> 在 LINE Developers 建立 LIFF 後拿到的 ID
//   2) SCRIPT_URL -> Apps Script 部署成「網頁應用程式」後拿到的網址（結尾 /exec）
// =====================================================================
const LIFF_ID = '2011380221-wdbTlkAs';
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxTMJg12pIJyrurHXz5yX6nbb6mGOeXJu0cBhrtGnN5CYG2YvdPCSD7ogxDotYxE6WYnQ/exec';

// 工種固定四選一，跟後端 Code.gs 的 WORK_TYPES 要一致
const WORK_TYPES = [
  { value: '公司', zh: '公司', th: 'บริษัท' },
  { value: '鋼筋', zh: '鋼筋', th: 'งานเหล็กเสริม' },
  { value: '模板', zh: '模板', th: 'งานแบบหล่อ' },
  { value: '水電', zh: '水電', th: 'งานประปาไฟฟ้า' },
];

// 工地固定三選一，跟後端 Code.gs 的 SITE_OPTIONS 要一致
// （打卡頁上顯示的是簡稱，月報表會自動換成正式地點名稱：學校→東海國中、警察局→豐里派出所、太麻里→太麻里）
const SITES = [
  { value: '學校', zh: '學校', th: 'โรงเรียน' },
  { value: '警察局', zh: '警察局', th: 'สถานีตำรวจ' },
  { value: '太麻里', zh: '太麻里', th: 'ไทมาลี่' },
];

const I18N = {
  zh: {
    title: '員工打卡',
    in: '上班打卡',
    out: '下班打卡',
    loading: '載入中...',
    hello: '哈囉，',
    chooseWorkType: '請先選擇今天的工種',
    chooseSite: '請先選擇今天的工地',
    selectionRequired: '請先選擇工種跟工地，再打卡',
    sending: '送出中...',
    success: '✅ 打卡成功',
    notFound: '找不到您的帳號，請把下面這串 LINE ID 提供給管理者，將您加入使用者名單後再試一次。',
    disabled: '您的帳號目前為停用狀態，請聯絡管理者。',
    error: '發生錯誤，請重試或聯絡管理者。',
    yourId: '您的 LINE ID（設定用）：',
  },
  th: {
    title: 'ลงเวลาทำงาน',
    in: 'เข้างาน',
    out: 'เลิกงาน',
    loading: 'กำลังโหลด...',
    hello: 'สวัสดี, ',
    chooseWorkType: 'กรุณาเลือกประเภทงานวันนี้ก่อน',
    chooseSite: 'กรุณาเลือกไซต์งานวันนี้ก่อน',
    selectionRequired: 'กรุณาเลือกประเภทงานและไซต์งานก่อนลงเวลา',
    sending: 'กำลังส่งข้อมูล...',
    success: '✅ บันทึกเวลาสำเร็จ',
    notFound: 'ไม่พบบัญชีของคุณ กรุณาส่ง LINE ID ด้านล่างนี้ให้ผู้ดูแลระบบเพื่อเพิ่มชื่อคุณก่อน แล้วลองใหม่อีกครั้ง',
    disabled: 'บัญชีของคุณถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ',
    error: 'เกิดข้อผิดพลาด กรุณาลองใหม่หรือติดต่อผู้ดูแลระบบ',
    yourId: 'LINE ID ของคุณ (สำหรับตั้งค่า): ',
  },
};

let lang = 'zh';
let profile = null;
let userOk = false;        // whoami 驗證是否通過
let selectedWorkType = ''; // 目前選擇的工種
let selectedSite = '';     // 目前選擇的工地

function t(key) {
  return I18N[lang][key];
}

function renderWorkTypeButtons() {
  const grid = document.getElementById('workTypeGrid');
  grid.innerHTML = '';
  WORK_TYPES.forEach((wt) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'choice-btn' + (selectedWorkType === wt.value ? ' active-worktype' : '');
    btn.innerText = wt[lang];
    btn.onclick = () => selectWorkType(wt.value);
    grid.appendChild(btn);
  });
}

function renderSiteButtons() {
  const grid = document.getElementById('siteGrid');
  grid.innerHTML = '';
  SITES.forEach((s) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'choice-btn' + (selectedSite === s.value ? ' active-site' : '');
    btn.innerText = s[lang];
    btn.onclick = () => selectSite(s.value);
    grid.appendChild(btn);
  });
}

function selectWorkType(value) {
  selectedWorkType = value;
  renderWorkTypeButtons();
  updateActionButtons();
}

function selectSite(value) {
  selectedSite = value;
  renderSiteButtons();
  updateActionButtons();
}

function updateActionButtons() {
  const enable = userOk && !!selectedWorkType && !!selectedSite;
  document.getElementById('btnIn').disabled = !enable;
  document.getElementById('btnOut').disabled = !enable;
}

function setLang(l) {
  lang = l;
  document.getElementById('title').innerText = t('title');
  document.getElementById('btnIn').innerText = t('in');
  document.getElementById('btnOut').innerText = t('out');
  document.getElementById('workTypeLabel').innerText = t('chooseWorkType');
  document.getElementById('siteLabel').innerText = t('chooseSite');
  renderWorkTypeButtons();
  renderSiteButtons();
  if (profile) {
    document.getElementById('userInfo').innerText = t('hello') + profile.displayName;
  }
}

async function callApi(payload) {
  const res = await fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify(payload),
  });
  return res.json();
}

async function init() {
  renderWorkTypeButtons();
  renderSiteButtons();
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    profile = await liff.getProfile();
    document.getElementById('userInfo').innerText = t('hello') + profile.displayName;
    document.getElementById('uidBox').innerText = t('yourId') + profile.userId;

    const who = await callApi({ action: 'whoami', lineUserId: profile.userId });
    if (!who.ok) {
      userOk = false;
      updateActionButtons();
      document.getElementById('status').innerText =
        who.error === 'user_disabled' ? t('disabled') : t('notFound');
    } else {
      userOk = true;
      updateActionButtons();
    }
  } catch (err) {
    document.getElementById('userInfo').innerText = t('error');
    document.getElementById('status').innerText = String(err);
  }
}

// 不做 GPS 定位，打卡只是為了方便統計出工數，直接送出工種／工地／上下班類型即可
function checkin(type) {
  if (!profile || !userOk) return;
  if (!selectedWorkType || !selectedSite) {
    document.getElementById('status').innerText = t('selectionRequired');
    return;
  }
  document.getElementById('status').innerText = t('sending');
  callApi({
    action: 'checkin',
    lineUserId: profile.userId,
    type: type,
    workType: selectedWorkType,
    site: selectedSite,
  })
    .then((json) => {
      if (!json.ok) {
        document.getElementById('status').innerText =
          json.error === 'user_disabled' ? t('disabled') : t('notFound');
        return;
      }
      document.getElementById('status').innerText = t('success');
    })
    .catch(() => {
      document.getElementById('status').innerText = t('error');
    });
}

init();
</script>
</body>
</html>
